<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trouver une association Alzheimer près de chez vous — Paroles d'Aidants</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />

<style>
  /* ===========================================================
     PALETTE
     Fond neutre chaud, encre presque-noire pour le texte,
     bleu-pétrole comme couleur de confiance (institutionnel,
     jamais criard), doré discret pour distinguer un second type
     de ressource, vert sauge pour un troisième. Aucune de ces
     couleurs n'est le rouge-orangé #E0603A réservé, dans le
     thème du forum, à l'encart "À ne pas oublier" des fiches :
     on ne veut pas diluer ce signal ailleurs.
     =========================================================== */
  :root{
    --bg: #FAF8F4;
    --panel: #FFFFFF;
    --ink: #21241F;
    --ink-soft: #565A52;
    --line: #E4E0D6;
    --teal: #2C5F62;
    --teal-dark: #1E4547;
    --gold: #A9782F;
    --sage: #587355;
    --focus: #1E4547;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: var(--teal-dark); }

  /* ---------- en-tête ---------- */
  header{
    padding: 22px 20px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1{
    margin:0 0 6px;
    font-size: clamp(1.25rem, 2.4vw, 1.6rem);
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header p{
    margin:0;
    color: var(--ink-soft);
    font-size: 0.98rem;
    max-width: 62ch;
    line-height: 1.5;
  }

  /* ---------- barre de recherche + filtres ---------- */
  .controls{
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items:center;
  }
  .search-wrap{
    position: relative;
    flex: 1 1 260px;
    min-width: 220px;
  }
  .search-wrap svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; opacity:0.5;
  }
  #search{
    width:100%;
    padding: 11px 14px 11px 38px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 1rem;
    color: var(--ink);
  }
  #search:focus{
    outline: 3px solid var(--focus);
    outline-offset: 1px;
  }
  .chips{ display:flex; gap:8px; flex-wrap: wrap; }
  .chip{
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font-size: 0.92rem;
    cursor:pointer;
    white-space: nowrap;
  }
  .chip[aria-pressed="true"]{
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }
  .chip:focus-visible{ outline: 3px solid var(--focus); outline-offset: 2px; }

  /* ---------- mise en page principale ---------- */
  .layout{
    display:flex;
    height: calc(100vh - 168px);
    min-height: 480px;
  }
  #map{ flex: 1 1 auto; }

  aside{
    width: 380px;
    max-width: 42vw;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow-y: auto;
  }
  #count{
    padding: 12px 18px 4px;
    font-size: 0.88rem;
    color: var(--ink-soft);
  }
  .card{
    display:block;
    width:100%;
    text-align:left;
    padding: 14px 18px;
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    cursor: pointer;
    font-family: inherit;
  }
  .card:hover, .card:focus-visible{ background: var(--bg); }
  .card:focus-visible{ outline: 3px solid var(--focus); outline-offset: -3px; }
  .card.active{ background: #F0EEE6; border-left: 4px solid var(--teal); padding-left: 14px; }
  .badge{
    display:inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    color: #fff;
    margin-bottom: 6px;
  }
  .badge.antenne{ background: var(--teal); }
  .badge.association{ background: var(--gold); }
  .badge.club{ background: var(--sage); }
  .card h3{
    margin: 0 0 4px;
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--ink);
  }
  .card p{
    margin: 2px 0;
    font-size: 0.9rem;
    color: var(--ink-soft);
    line-height: 1.4;
  }
  .card .liens{ margin-top: 6px; font-size: 0.88rem; }
  .card .liens a{ margin-right: 12px; }

  .empty{
    padding: 30px 18px;
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .leaflet-popup-content h3{ margin: 0 0 4px; font-size: 1rem; }
  .leaflet-popup-content p{ margin: 2px 0; font-size: 0.88rem; }

  /* ---------- mobile ---------- */
  @media (max-width: 760px){
    .layout{ flex-direction: column; height: auto; }
    #map{ height: 46vh; }
    aside{ width: 100%; max-width: none; border-left:none; border-top:1px solid var(--line); max-height: 50vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Trouver une association Alzheimer près de chez vous</h1>
  <p>Antennes France Alzheimer, associations locales et clubs / cafés mémoire. Cherchez votre ville ou votre département, ou choisissez un type de ressource ci-dessous.</p>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="text" placeholder="Rechercher une ville, un département…" autocomplete="off">
  </div>
  <div class="chips" role="group" aria-label="Filtrer par type de ressource">
    <button class="chip" data-type="all" aria-pressed="true">Tout afficher</button>
    <button class="chip" data-type="antenne" aria-pressed="false">Antennes France Alzheimer</button>
    <button class="chip" data-type="association" aria-pressed="false">Autres associations</button>
    <button class="chip" data-type="club" aria-pressed="false">Clubs / cafés mémoire</button>
  </div>
</div>

<div class="layout">
  <div id="map" role="application" aria-label="Carte des associations Alzheimer"></div>
  <aside>
    <div id="count"></div>
    <div id="list"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
/* =====================================================================
   DONNÉES DES RESSOURCES
   ---------------------------------------------------------------------
   Pour ajouter une ressource : copiez un bloc { ... } et modifiez les
   champs. Champs obligatoires : id, nom, type, ville, departement, lat, lng.
   Champs optionnels : adresse, telephone, site, note.

   type : "antenne" (antenne départementale France Alzheimer),
          "association" (autre association liée à Alzheimer),
          "club" (club, café mémoire, groupe de parole autonome)

   Pour trouver lat/lng d'une adresse : allez sur https://nominatim.openstreetmap.org
   tapez l'adresse, et copiez les coordonnées du résultat. Les entrées
   ci-dessous ont été géocodées au niveau de la ville (précision correcte
   pour une carte de repérage) : affinez-les si vous avez l'adresse exacte
   au moment de les ajouter.

   Sources des entrées de démarrage : sites officiels francealzheimer.org,
   pages locales des antennes (consultées le 07/09/2026). Cette liste est
   un point de départ, pas un annuaire complet — les ~95 autres antennes
   départementales restent à ajouter au fil du temps.
   ===================================================================== */
const RESSOURCES = [
  {
    id: "siege-national",
    nom: "Union nationale France Alzheimer et maladies apparentées",
    type: "antenne",
    ville: "Paris",
    departement: "75 — Paris",
    adresse: "21 boulevard Montmartre, 75002 Paris",
    telephone: "0 800 97 20 97",
    site: "https://www.francealzheimer.org",
    note: "Siège national. Numéro d'écoute Allô France Alzheimer, gratuit.",
    lat: 48.8712, lng: 2.3435
  },
  {
    id: "isere",
    nom: "France Alzheimer Isère",
    type: "antenne",
    ville: "Grenoble",
    departement: "38 — Isère",
    adresse: "34 avenue Marcelin Berthelot, 38100 Grenoble",
    telephone: "04 76 43 18 19",
    site: "https://www.francealzheimer.org/isere",
    lat: 45.1885, lng: 5.7245
  },
  {
    id: "val-de-marne",
    nom: "France Alzheimer Val-de-Marne",
    type: "antenne",
    ville: "Nogent-sur-Marne",
    departement: "94 — Val-de-Marne",
    adresse: "4 rue du Maréchal Vaillant, 94130 Nogent-sur-Marne",
    telephone: "01 48 72 87 82",
    note: "Permanences d'accueil dans une dizaine de villes du département.",
    lat: 48.8377, lng: 2.4830
  },
  {
    id: "seine-saint-denis",
    nom: "France Alzheimer Seine-Saint-Denis",
    type: "antenne",
    ville: "Le Raincy",
    departement: "93 — Seine-Saint-Denis",
    adresse: "91 avenue de la Résistance, 93340 Le Raincy",
    lat: 48.8933, lng: 2.5150
  },
  {
    id: "aisne",
    nom: "France Alzheimer Aisne",
    type: "antenne",
    ville: "Soissons",
    departement: "02 — Aisne",
    adresse: "35 boulevard Jeanne d'Arc, immeuble Royaumont, 02200 Soissons",
    site: "mailto:aisnealzheimer@gmail.com",
    lat: 49.3793, lng: 3.3236
  },
  {
    id: "seine-et-marne",
    nom: "France Alzheimer Seine-et-Marne",
    type: "antenne",
    ville: "Saint-Fargeau-Ponthierry",
    departement: "77 — Seine-et-Marne",
    adresse: "77310 Saint-Fargeau-Ponthierry (siège)",
    lat: 48.5450, lng: 2.6033
  }

  // 👉 Nouvelle ressource : copiez un bloc ci-dessus, séparez par une virgule.
];

/* ===================== initialisation carte ===================== */
const map = L.map('map', { scrollWheelZoom: true }).setView([46.6, 2.4], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 18
}).addTo(map);

const icons = {
  antenne: makeIcon('#2C5F62'),
  association: makeIcon('#A9782F'),
  club: makeIcon('#587355')
};
function makeIcon(color){
  return L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.35)"></div>`,
    iconSize: [16,16],
    iconAnchor: [8,8],
    popupAnchor: [0,-8]
  });
}

const clusterGroup = L.markerClusterGroup({ maxClusterRadius: 45 });
const markerById = {};

RESSOURCES.forEach(r => {
  const marker = L.marker([r.lat, r.lng], { icon: icons[r.type] });
  marker.bindPopup(popupHtml(r));
  marker.on('click', () => setActiveCard(r.id));
  markerById[r.id] = marker;
  clusterGroup.addLayer(marker);
});
map.addLayer(clusterGroup);

function popupHtml(r){
  return `<h3>${escapeHtml(r.nom)}</h3>
    <p>${escapeHtml(r.ville)}${r.adresse ? ' — ' + escapeHtml(r.adresse) : ''}</p>
    ${r.telephone ? `<p>☎ ${escapeHtml(r.telephone)}</p>` : ''}
    ${r.site ? `<p><a href="${escapeAttr(r.site)}" target="_blank" rel="noopener">Site / contact</a></p>` : ''}`;
}

/* ===================== liste latérale ===================== */
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
let currentType = 'all';
let activeId = null;

function typeLabel(t){
  return t === 'antenne' ? 'Antenne France Alzheimer'
       : t === 'association' ? 'Association'
       : 'Club / café mémoire';
}

function render(){
  const q = searchEl.value.trim().toLowerCase();
  const filtered = RESSOURCES.filter(r => {
    const matchesType = currentType === 'all' || r.type === currentType;
    const matchesQuery = !q ||
      r.ville.toLowerCase().includes(q) ||
      r.departement.toLowerCase().includes(q) ||
      r.nom.toLowerCase().includes(q);
    return matchesType && matchesQuery;
  });

  countEl.textContent = filtered.length === 0
    ? ''
    : filtered.length + (filtered.length > 1 ? ' ressources trouvées' : ' ressource trouvée');

  clusterGroup.clearLayers();
  filtered.forEach(r => clusterGroup.addLayer(markerById[r.id]));

  if (filtered.length === 0){
    listEl.innerHTML = `<div class="empty">Aucune ressource ne correspond à cette recherche. Essayez le nom d'une ville ou d'un département, ou <a href="https://www.francealzheimer.org" target="_blank" rel="noopener">consultez l'annuaire complet France Alzheimer</a>.</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(r => `
    <button class="card${r.id === activeId ? ' active' : ''}" data-id="${r.id}">
      <span class="badge ${r.type}">${typeLabel(r.type)}</span>
      <h3>${escapeHtml(r.nom)}</h3>
      <p>${escapeHtml(r.departement)}${r.adresse ? ' — ' + escapeHtml(r.adresse) : ''}</p>
      ${r.telephone ? `<p>☎ ${escapeHtml(r.telephone)}</p>` : ''}
      ${r.note ? `<p>${escapeHtml(r.note)}</p>` : ''}
      ${r.site ? `<p class="liens"><a href="${escapeAttr(r.site)}" target="_blank" rel="noopener">Site / contact</a></p>` : ''}
    </button>
  `).join('');

  listEl.querySelectorAll('.card').forEach(btn => {
    btn.addEventListener('click', () => focusResource(btn.dataset.id));
  });
}

function focusResource(id){
  const r = RESSOURCES.find(x => x.id === id);
  if (!r) return;
  setActiveCard(id);
  map.setView([r.lat, r.lng], 12, { animate: true });
  clusterGroup.zoomToShowLayer(markerById[id], () => {
    markerById[id].openPopup();
  });
}

function setActiveCard(id){
  activeId = id;
  document.querySelectorAll('.card').forEach(c => {
    c.classList.toggle('active', c.dataset.id === id);
  });
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if (el) el.scrollIntoView({ block: 'nearest' });
}

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
    chip.setAttribute('aria-pressed', 'true');
    currentType = chip.dataset.type;
    render();
  });
});
searchEl.addEventListener('input', render);

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

render();
</script>
</body>
</html>
