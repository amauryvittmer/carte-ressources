<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1EAD9;
    --card-bg: #FFFFFF;
    --blue: #2E5FA0;
    --blue-dark: #234C82;
    --text: #2E2A26;
    --muted: #6B6459;
    --border: #E3DAC5;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
    min-height: 60vh;
  }

  .card {
    text-align: center;
    max-width: 460px;
    width: 100%;
  }

  .icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 26px;
  }

  .icon svg { width: 100%; height: 100%; fill: var(--blue); }

  h1 {
    font-family: 'Bitter', Georgia, serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--blue-dark);
    line-height: 1.35;
    margin: 0 0 14px;
  }

  p {
    font-size: 16px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 32px;
  }

  .btn {
    display: inline-block;
    background: var(--blue);
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    padding: 15px 30px;
    border-radius: 999px;
    transition: background 0.15s ease;
  }

  .btn:hover, .btn:focus-visible {
    background: var(--blue-dark);
  }

  .btn:focus-visible {
    outline: 3px solid var(--blue-dark);
    outline-offset: 3px;
  }

  @media (max-width: 420px) {
    h1 { font-size: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
